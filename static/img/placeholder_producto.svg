    <rect x="55" y="5" width="8" height="10" rx="2" fill="#0369a1"/>
    <rect x="80" y="5" width="8" height="10" rx="2" fill="#0369a1"/>
    <rect x="30" y="105" width="8" height="10" rx="2" fill="#0369a1"/>
    <rect x="55" y="105" width="8" height="10" rx="2" fill="#0369a1"/>
