    <rect x="5" y="55" width="10" height="8" rx="2" fill="#0369a1"/>
    <rect x="5" y="80" width="10" height="8" rx="2" fill="#0369a1"/>
    <rect x="105" y="30" width="10" height="8" rx="2" fill="#0369a1"/>
    <rect x="105" y="55" width="10" height="8" rx="2" fill="#0369a1"/>
    <rect x="105" y="80" width="10" height="8" rx="2" fill="#0369a1"/>
